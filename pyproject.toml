[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socioeco_pipeline"
version = "1.0.0"
description = "Pipeline orquestador (Medallion Architecture) para el análisis de desarrollo social y económico en Colombia."
authors = [{name = "Data Engineering Team"}]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "duckdb>=0.9.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools]
packages = ["pipeline"]
